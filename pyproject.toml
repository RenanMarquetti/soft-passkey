[project]
name = "soft-passkey"
version = "0.1.0"
description = "Software WebAuthn/passkey authenticator for bots and machines: a separate, revocable credential instead of sharing a human's passkey."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["fido2>=2.0,<3", "cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
soft-passkey = "soft_passkey.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
python_functions = ["it_*", "test_*"]
testpaths = ["tests"]
